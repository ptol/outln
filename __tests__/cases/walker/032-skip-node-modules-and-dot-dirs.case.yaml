args:
  - input
input/src/app.ts: |
  /** App entry. */
  export const app = 1;
input/node_modules/pkg/index.ts: |
  /** Dependency. */
  export const dep = 1;
input/src/node_modules/inner.ts: |
  /** Nested dependency. */
  export const inner = 1;
input/.cache/cached.ts: |
  /** Cached. */
  export const cached = 1;
