args:
  - input/**/*.ts
  - input/direct.ts
input/direct.ts: |
  /** Direct file. */
  export const direct = true;
stdout: |
  glob view: input/**/*.ts input/direct.ts
  Includes only header comments per file.
  For file-level outlines, use `outln [FILE]...`.
  input/direct.ts: Direct file.
stderr: ''
